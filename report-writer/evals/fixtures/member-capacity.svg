<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">图 2 会员规模与理论容量</title>
  <desc id="desc">原始评测图，仅呈现六千名会员和三千平方米门店面积，等待写作任务补充到店频次与晚间客流说明。</desc>
  <rect width="960" height="420" fill="#f8f5ef"/>
  <rect x="70" y="75" width="820" height="270" rx="18" fill="#fdfaf5" stroke="#b08d5a" stroke-width="2"/>
  <text x="110" y="135" fill="#2e2a25" font-size="30" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">会员规模与理论容量</text>
  <text x="110" y="215" fill="#2e2a25" font-size="54" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">6,000 名会员</text>
  <text x="110" y="280" fill="#7a4a28" font-size="42" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif">3,000 平方米门店面积</text>
  <text x="110" y="325" fill="#6b655d" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif">原图未包含到店频次和分时段客流</text>
</svg>
