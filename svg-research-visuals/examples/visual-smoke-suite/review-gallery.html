<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>精致暖色研究图 · v2 审查台</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9e4da;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:#26231e}
  header{padding:28px 40px;border-bottom:1px solid #ddd6c9;background:#f6f2ea}
  h1{margin:0;font-size:24px;font-weight:800}
  header p{margin:8px 0 0;color:#6a655c;font-size:14px;line-height:1.6;max-width:980px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:26px;padding:34px 40px 80px}
  figure{margin:0;background:#fffefb;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(50,42,32,.05),0 12px 30px -18px rgba(50,42,32,.28)}
  img{width:100%;display:block;background:#fffefb}
  figcaption{padding:11px 16px;font-size:13px;color:#6a655c;border-top:1px solid #efe6d9}
  figcaption b{color:#9c5d28;font-family:"Libre Franklin","Helvetica Neue",monospace;margin-right:8px}
</style>
</head>
<body>
<header>
  <h1>精致暖色研究图 · v2 视觉审查台</h1>
  <p>统一缩略尺度并排，检查跨版式的字体、信息密度、色彩锚点与留白是否一致（防止漂移）。共 25 张，编号 00–24 连续；00 为锚点参考，22–24 为 v2 新增主力（指标总表 / 三情景 / 归因拆解）。西文/数字默认走系统回退（Libre Franklin→Helvetica/Arial、Newsreader→Georgia），无 @import / 网络字体，直接打开即可正常显示；运行 <code>scripts/subset-fonts.sh</code> 后改为内嵌 WOFF2 子集，离线也命中目标西文字。缩略图仅供快速节奏复核。</p>
</header>
<div class="grid" id="g"></div>
<script>
const figs=[
["00","视觉系统总览"],["01","趋势数据图"],["02","机制流程图"],["03","横向比较表"],["04","手机转发图"],
["05","价值桥"],["06","层级图"],["07","构成与排序"],["08","事件时间线"],["09","二维定位图"],
["10","条件与证伪"],["11","KPI仪表板"],["12","多系列同行趋势"],["13","估值敏感性矩阵"],["14","小倍图同行比较"],
["15","构成迁移与关键层"],["16","真实数据散点图"],["17","估值区间图"],["18","论证链"],["19","分层叙事"],
["20","闭环飞轮"],["21","论点树"],["22","指标总表"],["23","三情景假设"],["24","归因拆解"]
];
const g=document.getElementById('g');
for(const [n,name] of figs){
  const f=document.createElement('figure');
  const im=document.createElement('img');im.src=n+'-'+name+'.svg';im.loading='lazy';im.alt=name;
  const c=document.createElement('figcaption');c.innerHTML='<b>'+n+'</b>'+name;
  f.appendChild(im);f.appendChild(c);g.appendChild(f);
}
</script>
</body>
</html>
